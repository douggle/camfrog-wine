# Load v4l2loopback at boot with the options from
# /etc/modprobe.d/99-v4l2loopback-obs.conf.
#
# Installed as /etc/modules-load.d/v4l2loopback.conf.
#
# Preloading matters: if OBS loads the module itself it does so with
# exclusive_caps=1, and the node then fails the capture-capability check Wine
# uses to enumerate cameras. With the module already loaded, OBS's own modprobe
# call is a no-op and cannot change the parameters.

v4l2loopback
