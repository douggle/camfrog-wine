# Load v4l2loopback so OBS's virtual camera is usable from Wine applications.
#
# Installed as /etc/modprobe.d/99-v4l2loopback-obs.conf.
#
# exclusive_caps=0 keeps the node advertising V4L2_CAP_VIDEO_CAPTURE even while
# OBS is not streaming. With the module default (exclusive_caps=1) the node
# reports only video output until a producer opens it, and Wine's avicap32 probe
# - which needs the capture capability - skips it, so "OBS Virtual Camera"
# disappears from Camfrog's Video Capture Device list.
#
# video_nr=10 pins the node to /dev/video10, the number OBS creates by default,
# so the device does not shift around between boots.

options v4l2loopback video_nr=10 exclusive_caps=0
